<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantoral — Préparation des chants liturgiques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F6F1E4;
  --cream-2:#EFE8D6;
  --paper:#FFFDF7;
  --ink:#2B241D;
  --ink-soft:#5C5344;
  --wine:#6E2439;
  --wine-dark:#4E1729;
  --wine-tint:#F1DCE0;
  --gold:#A67C2E;
  --gold-tint:#F3E6C8;
  --sage:#5C6E4E;
  --sage-tint:#E4EADC;
  --line:#DCD3BE;
  --line-strong:#C7BC9F;
  --radius:10px;
  --shadow:0 1px 3px rgba(43,36,29,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
h1{font-size:28px;font-weight:600;margin:0 0 4px;}
h2{font-size:21px;font-weight:600;margin:0 0 12px;}
h3{font-size:17px;font-weight:600;margin:0 0 8px;}
p{line-height:1.6;color:var(--ink-soft);}
a{color:var(--wine);}
button, .btn{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  font-weight:500;
  border:1px solid var(--line-strong);
  background:var(--paper);
  color:var(--ink);
  border-radius:var(--radius);
  padding:9px 15px;
  cursor:pointer;
  transition:all .12s ease;
}
button:hover, .btn:hover{border-color:var(--wine);color:var(--wine);}
button.primary{background:var(--wine);border-color:var(--wine);color:#fff;}
button.primary:hover{background:var(--wine-dark);border-color:var(--wine-dark);color:#fff;}
button.ghost{background:transparent;border-color:transparent;}
button.ghost:hover{background:var(--cream-2);border-color:transparent;}
button.danger{color:#8a2b2b;}
button.danger:hover{background:#F7E4E4;border-color:#8a2b2b;}
button:disabled{opacity:.4;cursor:not-allowed;}
input,select,textarea{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  border:1px solid var(--line-strong);
  border-radius:8px;
  padding:8px 10px;
  background:var(--paper);
  color:var(--ink);
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-tint);border-color:var(--gold);}
label{font-size:12.5px;font-weight:500;color:var(--ink-soft);display:block;margin-bottom:4px;}
.field{margin-bottom:14px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.02em;}
.badge.wine{background:var(--wine-tint);color:var(--wine-dark);}
.badge.gold{background:var(--gold-tint);color:#6b5220;}
.badge.sage{background:var(--sage-tint);color:#3d4a33;}
.badge.gray{background:var(--cream-2);color:var(--ink-soft);}
.muted{color:var(--ink-soft);font-size:13px;}
.row{display:flex;gap:10px;align-items:center;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line-strong);}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:var(--cream-2);}

/* ---- App shell ---- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--wine-dark);color:#F3E6DD;
  padding:22px 16px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:0 6px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--wine-dark);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;flex-shrink:0;}
.brand-text{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.15;}
.brand-text span{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;color:#D8B8A8;letter-spacing:.04em;text-transform:uppercase;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:#EBDACE;text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;
}
.nav-item:hover{background:rgba(255,255,255,0.08);}
.nav-item.active{background:rgba(255,255,255,0.14);color:#fff;}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#B78E7C;margin:16px 8px 6px;}
.nav-icon{width:16px;text-align:center;font-family:'Fraunces',serif;font-size:14px;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.12);}
.role-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.07);font-size:12.5px;}
.role-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.switch-link{font-size:11.5px;color:#D8B8A8;text-decoration:underline;cursor:pointer;margin-top:6px;display:inline-block;}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-soft);text-decoration:none;cursor:pointer;margin-bottom:16px;}
.back-link:hover{color:var(--wine);}
main{flex:1;padding:32px 40px;max-width:1100px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;}
.crumb{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.toolbar input, .toolbar select{width:auto;}
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.stamp{font-family:'Fraunces',serif;font-size:12px;border:1px solid var(--line-strong);border-radius:20px;padding:2px 10px;color:var(--ink-soft);}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);}
.login-card{width:400px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:0 4px 20px rgba(43,36,29,0.08);}
.role-option{border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.role-option:hover{border-color:var(--wine);}
.role-option.selected{border-color:var(--wine);background:var(--wine-tint);}
.role-option b{font-family:'Fraunces',serif;font-size:15px;}

/* chant card */
.chant-list{display:flex;flex-direction:column;gap:10px;}
.chant-row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;}
.chant-row:hover{border-color:var(--wine);}
.chant-row .rib{width:5px;align-self:stretch;border-radius:4px;background:var(--gold);flex-shrink:0;}
.chant-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
.chant-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}

.lyrics{font-family:'Fraunces',serif;white-space:pre-wrap;line-height:1.9;font-size:15px;background:var(--cream-2);border-radius:10px;padding:18px 20px;}

.prog-slot{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
.prog-slot:last-child{border-bottom:none;}
.prog-slot label{margin:0;}
.score{font-size:11px;color:var(--sage);font-weight:600;}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media print{.sidebar,.toolbar,.no-print{display:none !important;}main{padding:0;max-width:100%;}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app.js"></script>
</body>
</html>
