name: Audit Lighthouse - Cantoral (version initiale)

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code (script lighthouse-audit.js)
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Puppeteer et Lighthouse
        working-directory: lighthouse-audit
        run: npm install puppeteer lighthouse

      - name: Autoriser Chrome à démarrer dans cet environnement (restriction noyau Ubuntu)
        run: |
          echo 'kernel.apparmor_restrict_unprivileged_userns=0' | sudo tee -a /etc/sysctl.d/60-apparmor-namespace.conf
          sudo sysctl --system

      - name: Lancer l'audit (sélection du rôle Visiteur, puis Lighthouse)
        working-directory: lighthouse-audit
        env:
          TARGET_URL: https://cantoral.nadybabs2023.workers.dev
          ROLE_SELECTOR: "#opt-visiteur"
          OUTPUT_PATH: lighthouse-report-cantoral.json
        run: node lighthouse-audit.js

      - name: Sauvegarder le rapport
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-cantoral
          path: lighthouse-audit/lighthouse-report-cantoral.json
          retention-days: 90
